pipeline:
  identifier: pw
  name: pw
  orgIdentifier: clab343org
  projectIdentifier: clab343ip1
  stages:
    - stage:
        description: Run Playwright end-to-end tests against the frontend
        identifier: Playwright_E2E_Tests
        name: Playwright E2E Tests
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  identifier: run_playwright_tests
                  name: Install and Run Playwright Tests
                  type: Container
                  spec:
                    connectorRef: dockerhub
                    image: mcr.microsoft.com/playwright:v1.50.0-noble
                    shell: Sh
                    command: |-
                      set +e
                      mkdir -p /tmp/pw/tests && cd /tmp/pw

                      cat <<'PKG' > package.json
                      {
                        "name": "harness-frontend-playwright-tests",
                        "version": "1.0.0",
                        "devDependencies": {
                          "@playwright/test": "1.50.0"
                        }
                      }
                      PKG

                      cat <<'CFG' > playwright.config.ts
                      import { defineConfig } from '@playwright/test';
                      export default defineConfig({
                        testDir: './tests',
                        timeout: 30_000,
                        expect: { timeout: 5_000 },
                        fullyParallel: true,
                        retries: 0,
                        reporter: [['list']],
                        use: {
                          baseURL: process.env.BASE_URL || 'http://localhost:4000',
                          headless: true,
                          screenshot: 'only-on-failure',
                          trace: 'retain-on-failure',
                        },
                        projects: [{ name: 'chromium', use: { browserName: 'chromium' } }],
                      });
                      CFG

                      cat <<'SPEC' > tests/frontend.spec.ts
                      import { test, expect } from '@playwright/test';

                      test.describe('Home Page', () => {
                        test.beforeEach(async ({ page }) => { await page.goto('/'); });

                        test('should load with correct title', async ({ page }) => {
                          await expect(page).toHaveTitle('Harness Webapp');
                        });

                        test('should display the navbar with logo and nav links', async ({ page }) => {
                          await expect(page.locator('img[alt="Harness logo"]')).toBeVisible();
                          await expect(page.locator('a.nav-link', { hasText: 'Home' })).toBeVisible();
                          await expect(page.locator('a.nav-link', { hasText: 'Distribution' })).toBeVisible();
                        });

                        test('should display service name, version, and last execution', async ({ page }) => {
                          await expect(page.locator('h1.heading').first()).toBeVisible();
                          await expect(page.locator('h1.heading', { hasText: 'Version' })).toBeVisible();
                          await expect(page.locator('h1.heading', { hasText: 'Last Execution' })).toBeVisible();
                        });

                        test('should have a visible Check Release button', async ({ page }) => {
                          const btn = page.locator('#checkReleaseBtn');
                          await expect(btn).toBeVisible();
                          await expect(btn).toHaveText('Check Release');
                        });

                        test('should display the footer with Powerpay logo', async ({ page }) => {
                          await expect(page.locator('footer img[alt="Powerpay by Dayforce"]')).toBeVisible();
                        });
                      });

                      test.describe('Navigation', () => {
                        test('should navigate to Distribution page via nav link', async ({ page }) => {
                          await page.goto('/');
                          await page.locator('a.nav-link', { hasText: 'Distribution' }).click();
                          await expect(page).toHaveURL(/\/distribution/);
                          await expect(page).toHaveTitle('Distribution - Harness Webapp');
                        });
                      });

                      test.describe('Distribution Page', () => {
                        test.beforeEach(async ({ page }) => { await page.goto('/distribution'); });

                        test('should load with correct title', async ({ page }) => {
                          await expect(page).toHaveTitle('Distribution - Harness Webapp');
                        });

                        test('should display the chart canvas', async ({ page }) => {
                          await expect(page.locator('#distributionChart')).toBeVisible();
                        });

                        test('should have play and refresh buttons', async ({ page }) => {
                          await expect(page.locator('#runBtn')).toBeVisible();
                          await expect(page.locator('#refreshBtn')).toBeVisible();
                        });

                        test('should display the navbar on distribution page', async ({ page }) => {
                          await expect(page.locator('img[alt="Harness logo"]')).toBeVisible();
                        });

                        test('should display the footer on distribution page', async ({ page }) => {
                          await expect(page.locator('footer img[alt="Powerpay by Dayforce"]')).toBeVisible();
                        });
                      });
                      SPEC

                      npm install --no-audit --no-fund

                      npx playwright test --reporter=list,junit 2>&1
                      TEST_EXIT=$?

                      JUNIT_FILE="/tmp/pw/results/junit-results.xml"

                      if [ -f "$JUNIT_FILE" ]; then
                        TOTAL=$(grep -o 'tests="[0-9]*"' "$JUNIT_FILE" | head -1 | grep -o '[0-9]*')
                        FAILURES=$(grep -o 'failures="[0-9]*"' "$JUNIT_FILE" | head -1 | grep -o '[0-9]*')
                        SKIPPED=$(grep -o 'skipped="[0-9]*"' "$JUNIT_FILE" | head -1 | grep -o '[0-9]*')
                        DURATION=$(grep -o 'time="[0-9.]*"' "$JUNIT_FILE" | head -1 | grep -o '[0-9.]*')
                        PASSED=$((${TOTAL:-0} - ${FAILURES:-0} - ${SKIPPED:-0}))
                      else
                        TOTAL=0; FAILURES=0; SKIPPED=0; PASSED=0; DURATION=0
                      fi

                      if [ "${FAILURES:-0}" -eq 0 ] && [ "${TOTAL:-0}" -gt 0 ]; then
                        STATUS="PASSED"
                      elif [ "${TOTAL:-0}" -eq 0 ]; then
                        STATUS="NO_TESTS"
                      else
                        STATUS="FAILED"
                      fi

                      SUMMARY="${PASSED}/${TOTAL} passed, ${FAILURES} failed, ${SKIPPED} skipped in ${DURATION}s"

                      export test_status="$STATUS"
                      export test_total="$TOTAL"
                      export test_passed="$PASSED"
                      export test_failed="$FAILURES"
                      export test_skipped="$SKIPPED"
                      export test_duration="$DURATION"
                      export test_summary="$SUMMARY"

                      echo ""
                      echo "========================================="
                      echo "  Playwright Test Results: $STATUS"
                      echo "  $SUMMARY"
                      echo "========================================="

                      mkdir -p /addon/tmp
                    envVariables:
                      BASE_URL: <+pipeline.variables.base_url>
                      PLAYWRIGHT_JUNIT_OUTPUT_NAME: /tmp/pw/results/junit-results.xml
                    infrastructure:
                      type: KubernetesDirect
                      spec:
                        connectorRef: k8sprod
                        namespace: default
                        resources:
                          limits:
                            cpu: "1"
                            memory: 2Gi
                        annotations: {}
                        labels: {}
                        containerSecurityContext:
                          capabilities:
                            drop: []
                            add: []
                        nodeSelector: {}
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - /tmp/pw/results/junit-results.xml
                    outputVariables:
                      - name: test_status
                      - name: test_total
                      - name: test_passed
                      - name: test_failed
                      - name: test_skipped
                      - name: test_duration
                      - name: test_summary
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore
  tags: {}
  variables:
    - name: base_url
      type: String
      description: Target URL for Playwright tests
      required: false
      value: https://frontend-prod-clab343ip1-ns.apps.rosa.u7s2r6r8i3b3v5k.4qrx.p3.openshiftapps.com/
